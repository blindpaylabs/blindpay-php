name: API Sync

on:
  repository_dispatch:
    types: [api-sync]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    name: Sync SDK with API changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Fetch the new spec from api-sync-data
        run: |
          git fetch origin api-sync-data
          git show origin/api-sync-data:.api-sync/spec-current.json > .api-sync/spec-current.json

      - name: Create or reset the api-sync branch
        run: |
          git fetch origin api-sync 2>/dev/null || true
          if git rev-parse --verify origin/api-sync >/dev/null 2>&1; then
            git checkout api-sync
            git reset --hard origin/main
          else
            git checkout -b api-sync
          fi

      - name: Run the patcher
        id: patch
        run: |
          set +e
          php scripts/api-sync.php --apply --report=/tmp/api-sync-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Fail loudly on needs-human
        if: steps.patch.outputs.exit_code != '0'
        run: |
          echo "::error::api-sync found drift it cannot apply mechanically -- a human must decide. See the patcher output above, and update .api-sync/spec-map.json, .api-sync/unmodeled.json or .api-sync/known-divergences.json accordingly."
          cat /tmp/api-sync-report.json || true
          exit 1

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- . ':!.github')" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit quietly, nothing to sync
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No pending drift. Nothing to sync."

      - name: Determine version bump
        if: steps.changes.outputs.has_changes == 'true'
        id: bump
        run: |
          BUMP=$(php -r '$r = json_decode(file_get_contents("/tmp/api-sync-report.json"), true); echo $r["bump"]["type"] ?? "patch";')
          VERSION=$(php -r '$r = json_decode(file_get_contents("/tmp/api-sync-report.json"), true); echo $r["bump"]["version"] ?? "";')
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SDK_SYNC_PAT }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/ 2>/dev/null || true
          git add -A
          git reset HEAD .github/workflows/ 2>/dev/null || true
          git commit -m "${{ steps.bump.outputs.type == 'minor' && 'feat' || 'fix' }}: sync SDK with API changes (${{ steps.bump.outputs.type }}, v${{ steps.bump.outputs.version }})"
          git push --force-with-lease origin api-sync

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number // empty')
          BODY="Automated deterministic sync from the latest API spec.

          Version bump: **${{ steps.bump.outputs.type }}** -> \`${{ steps.bump.outputs.version }}\`

          Generated by \`php scripts/api-sync.php --apply\`. See the workflow run for the full report."

          if [ -n "$PR_NUMBER" ]; then
            echo "Updating existing PR #$PR_NUMBER"
            gh pr edit "$PR_NUMBER" --body "$BODY"
          else
            gh pr create \
              --title "sync: SDK with API changes" \
              --body "$BODY" \
              --base main \
              --head api-sync \
              --label api-sync
            PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number')
          fi

          gh pr merge "$PR_NUMBER" --auto --squash
